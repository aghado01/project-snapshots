name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.6'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m pytest tests/ -v
      - name: Run baseline (cached)
        run: |
          mkdir -p reports/baseline-ci
          python -m src.runners.batch --out reports/baseline-ci --prompts data/prompts --config configs/providers.yaml
      - name: Run candidate
        run: |
          mkdir -p reports/candidate-ci
          python -m src.runners.batch --out reports/candidate-ci --prompts data/prompts --config configs/providers.yaml
      - name: Gates compare
        run: |
          python -m src.runners.compare --baseline reports/baseline-ci --candidate reports/candidate-ci --gates configs/gates.yaml
