name: Refresh Model Inventory

on:
  workflow_dispatch:
    inputs:
      model_root:
        description: GGUF model root visible to the runner
        required: false
        default: D:\models\gguf
      include_sha256:
        description: Hash GGUF files before writing inventory
        required: false
        default: "false"
  schedule:
    - cron: "0 8 * * *"
  push:
    branches: [main]
    paths:
      - scripts/refresh_model_inventory.ps1
      - .github/workflows/model-inventory.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      - name: Refresh GGUF inventory
        shell: pwsh
        env:
          MODEL_ROOT: ${{ inputs.model_root || 'D:\models\gguf' }}
          INCLUDE_SHA256: ${{ inputs.include_sha256 || 'false' }}
        run: |
          $args = @(
            '-ModelRoot', $env:MODEL_ROOT,
            '-OutputPath', 'data/model_inventory.json'
          )
          if ($env:INCLUDE_SHA256 -eq 'true') {
            $args += '-IncludeSha256'
          }
          ./scripts/refresh_model_inventory.ps1 @args

      - name: Commit inventory changes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/model_inventory.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No model inventory changes.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            throw "git diff failed with exit code $LASTEXITCODE"
          }
          git commit -m 'Refresh local GGUF model inventory'
          git push
