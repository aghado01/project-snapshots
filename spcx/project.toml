format_version = 1
title = "pwshspc project inventory"
repo = "ps.core.pwshspc"
last_reviewed = "2026-05-15"

[maintenance]
owner = "human-maintained"
routine = [
  "Update this file when a project is added, removed, renamed, or re-scoped.",
  "Update this file when source roots or major source files move between domains.",
  "Update docs/project-primer.md if the inventory authority or maintenance contract changes."
]

[authority]
inventory = "project.toml"
spc_target_docs = ["docs/spc-maturity.md", "docs/state-engine-design.md"]

[status]
spc_renovation = "Legacy SPC sources were evicted wholesale to .depr/spc/ to clear the air for a rewrite. src/clustering/spc/ is now an intentionally empty rewrite surface; the next SPC spine will be rebuilt from scratch as a consumer of extracted primitives plus whatever runtime-specific Potts and thermo residuals remain. Treat docs/spc-maturity.md and docs/state-engine-design.md as the target-shape authority."

[paths]
projects = "projects/"
src = "src/"
artifacts = "artifacts/"
docs = "docs/"
discussion = ".discussion/"
deprecated = ".depr/"

[[project]]
name = "Maths.LinAlg"
path = "projects/Maths.LinAlg"
assembly = "Maths.LinAlg"
sources = ["src/maths/linalg"]
role = "Linear algebra primitives: Cholesky, Eigen, ICA, Norms, PCA, and streaming diagonal Mahalanobis estimation."

[[project]]
name = "Maths.Rng"
path = "projects/Maths.Rng"
assembly = "Maths.Rng"
sources = ["src/maths/rng"]
role = "High-quality pseudo-random number generators (Xoshiro256++)."

[[project]]
name = "Graphs.Distance"
path = "projects/Graphs.Distance"
assembly = "Graphs.Distance"
sources = ["src/graphs/distance"]
role = "Distance and similarity metrics organized by geometry: euclidean/, geodesic/, probability/, sets/, other/."

[[project]]
name = "Graphs.Coupling"
path = "projects/Graphs.Coupling"
assembly = "Graphs.Coupling"
sources = ["src/graphs/coupling"]
role = "Distance-to-coupling kernel primitives and bandwidth estimation."

[[project]]
name = "Graphs.Proximity"
path = "projects/Graphs.Proximity"
assembly = "Graphs.Proximity"
sources = ["src/graphs", "src/graphs/proximity"]
role = "Graph construction, topology selection, and proximity graph primitives."
notes = [
  "src/graphs/*.cs contributes the graph-construction surface shared by GraphBuilder, BandwidthEstimation, and NeighborSelection.",
  "src/graphs/primitives is owned by Graphs.Primitives.",
  "src/graphs/coupling is owned by Graphs.Coupling."
]

[[project]]
name = "Estimators"
path = "projects/Estimators"
assembly = "Estimators"
sources = ["src/estimators"]
role = "Estimator primitives and related statistical helpers."

[[project]]
name = "Maths.Geometry"
path = "projects/Maths.Geometry"
assembly = "Maths.Geometry"
sources = ["src/maths/geometry"]
role = "Riemannian geometry abstractions plus local geometric diagnostics: IRiemannianManifold, product manifolds, Euclidean vector manifold, and LocalTangent."

[[project]]
name = "Maths.Optimization"
path = "projects/Maths.Optimization"
assembly = "Maths.Optimization"
sources = ["src/maths/optimization"]
role = "Robust optimization primitives: IRLS, robust loss interfaces (folded from src/losses)."

[[project]]
name = "Synthetic"
path = "projects/Synthetic"
assembly = "Synthetic"
sources = ["src/synthetic"]
role = "Ground-truth synthetic dataset generators and geometry DTOs."

[[project]]
