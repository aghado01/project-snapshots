path = "projects/Graphs.Distance"
assembly = "Graphs.Distance"
sources = ["src/graphs/distance"]
role = "Distance and similarity metrics organized by geometry: euclidean/, geodesic/, probability/, sets/, other/."

[[project]]
name = "Graphs.Coupling"
path = "projects/Graphs.Coupling"
assembly = "Graphs.Coupling"
sources = ["src/graphs/coupling"]
role = "Distance-to-coupling kernel primitives and bandwidth estimation."
notes = [
  "As of 2026-05-17 this project also carries the mixture-kernel surface: Graphs.Coupling.Mixture plus the shared Graphs-namespace MixtureWeights and MixtureBandwidth record types compiled from src/graphs/coupling/MixtureTypes.cs.",
  "The mixture path is a weighted Gaussian/Cauchy/Laplacian combination; weights are caller-controlled and the per-family bandwidth tuple is derived from one shared sample MAD via BandwidthEstimation.ForMixture(...)."
]

[[project]]
name = "Graphs.Proximity"
path = "projects/Graphs.Proximity"
assembly = "Graphs.Proximity"
sources = ["src/graphs", "src/graphs/proximity"]
role = "Graph construction, topology selection, and proximity graph primitives."
notes = [
  "src/graphs/*.cs contributes the graph-construction surface shared by GraphBuilder, BandwidthEstimation, NeighborSelection, and the new Graphs.Diagnostics modules compiled from src/graphs/diagnostics/.",
  "The 2026-05-17 diagnostics pass moved connectivity validation to Graphs.Diagnostics.Connectivity, added AlgebraicConnectivity / EdgeWeights / Degree / NeighborhoodScale / MstBridge / Hubness / Cycles, wired Graphs.Proximity to TDA.Primitives for cycle triangle counting, and changed GraphBuilder.Build(...) to estimate bandwidth before EnsureConnected(...) can inject MST bridge distances.",
  "The same day also added GraphBuilder.BuildWithMixture(...) and ToGraphMixture(...): a dedicated mixture path that mirrors the Stage-2 bandwidth-before-repair discipline while combining Gaussian/Cauchy/Laplacian couplings through one shared-MAD-derived bandwidth tuple.",
  "src/graphs/primitives is owned by Graphs.Primitives.",
  "src/graphs/coupling is owned by Graphs.Coupling."
]

