  "Current compile break is isolated to unresolved Manifolds-facing and ETL-facing types in projects/VizApi/Program.cs and projects/VizApi/DistanceFactory.cs.",
  "Missing symbols reported in the latest build were Manifolds, ProbeContract, and ProbeMetric, indicating incomplete retargeting from the historical EmbeddingEtl / manifold boundary to the current src/ETL and successor geometry surfaces."
]

