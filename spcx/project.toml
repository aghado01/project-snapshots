format_version = 1
title = "pwshspc project inventory"
repo = "ps.core.pwshspc"
last_reviewed = "2026-05-17"

[maintenance]
owner = "human-maintained"
routine = [
  "Update this file when a project is added, removed, renamed, or re-scoped.",
  "Update this file when source roots or major source files move between domains.",
  "Update docs/project-primer.md if the inventory authority or maintenance contract changes."
]

[authority]
inventory = "project.toml"
spc_target_docs = ["docs/spc-maturity.md", "docs/state-engine-design.md"]

[status]
spc_renovation = "Legacy SPC sources were evicted wholesale to .depr/spc/ during the reset, but src/clustering/spc/ is no longer empty: it now contains the rebuilt Potts/runtime spine (PottsModel, SpcScheduler, adaptive scheduler, checkpoint DTO/IO, and edge-observable sidecars). Treat docs/spc-maturity.md and docs/state-engine-design.md as the target-shape authority for where the SPC architecture is heading, but use project.toml and the active source tree for what currently builds."

[paths]
projects = "projects/"
src = "src/"
src_dev = "src_dev/"
artifacts = "artifacts/"
docs = "docs/"
discussion = ".discussion/"
deprecated = ".depr/"

[[project]]
name = "Maths.LinAlg"
path = "projects/Maths.LinAlg"
assembly = "Maths.LinAlg"
sources = ["src/maths/linalg"]
role = "Linear algebra and numerical primitives: BSpline, Cholesky, Eigen, ICA, MatrixOps, PCA, and streaming diagonal Mahalanobis estimation."
notes = [
  "Graph-aware spectral and Laplacian operators were split into TDA.Primitives on 2026-05-16; Maths.LinAlg is back to a dependency-free numerical surface.",
  "MatrixOps still owns the flat block-vector helpers used by iterative solvers and other hot numerical paths.",
  "Eigen.DecomposeSymmetric was materially repaired during the dense fixture pass (Jacobi rotation-angle correction plus higher sweep budget) and now underpins the green Phase 1 dense truth surface in VizCore.Tests."
]

