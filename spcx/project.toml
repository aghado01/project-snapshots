]

[[project]]
name = "VizCore.Tests"
path = "projects/tests/VizCore.Tests"
assembly = "VizCore.Tests"
sources = ["projects/tests/VizCore.Tests"]
role = "xUnit contract host for VizCore fixture-golden drafts plus focused layer-contract coverage."
status = "test"
notes = [
  "Added on 2026-05-16 and wired into ps.core.pwshspc.sln.",
  "Phase 1 node-signal fixture coverage remains active on the dense path, while the host now also carries focused GraphBuilder bandwidth-regression checks, Graphs.Diagnostics coverage, and expanded TriangleLayer / FlagComplex contract facts including CountTriangles(CsrGraph).",
  "As of 2026-05-17 the GraphDiagnosticsTests slice covers Hubness and Cycles explicitly, including the theta-graph longer-cycle fixture and the over-cap sentinel guard path.",
  "MixtureKernelTests now covers shared-MAD mixture bandwidth estimation, pure-kernel evaluator identities, BuildWithMixture(...) round-trips against the standard single-kernel path, the mixture-path EnsureConnected regression, and explicit-bandwidth override behavior.",
  "SpcDiagnosticsTests now covers Shannon entropy, Tier 1 SPC curve aggregation, bond-frequency entropy, the graph-derived critical-temperature heuristic, and AdaptiveScheduler's default-vs-explicit temperature envelope resolution.",
  "The host carries a TDA.Primitives reference and currently uses dense spectral routing for connected graphs plus helper-local dense disconnected extraction, while also exercising raw-triples FlagComplex enumeration, CountTriangles(CsrGraph), and Viz-side TriangleLayer.SourceEdgeLayerId threading.",
  "The test host no longer owns a private artifact helper: shared test-run plumbing is compile-linked from projects/tests/HarnessArtifacts.cs via projects/tests/Directory.Build.targets, and the benchmark/dispatch/fixture harnesses now emit manifest-backed payloads under artifacts/test-runs/<suite>/<timestamp>."
]

