[[project]]
name = "Spc.BlattAnalyze"
path = "projects/tests/Spc.BlattAnalyze"
assembly = "Spc.BlattAnalyze"
sources = ["projects/tests/Spc.BlattAnalyze"]
role = "Offline one-off: reads a checkpoint directory, emits per-temperature CSV with χ_FK(T), ⟨E⟩(T), specific heat, and a fragmentation proxy. Generic over fixture (Blatt name retained for sibling pairing; works against any SPCX directory)."
status = "smoke"

[[project]]
name = "Spc.HyperbolicSmoke"
path = "projects/tests/Spc.HyperbolicSmoke"
assembly = "Spc.HyperbolicSmoke"
sources = ["projects/tests/Spc.HyperbolicSmoke"]
role = "End-to-end smoke harness: Blatt hierarchy in the Poincaré ball → Cauchy-weighted CsrGraph → SpcScheduler. Companion to Spc.BlattSmoke for the multi-metric thesis (same scheduler, different geometry/kernel)."
status = "smoke"

[[source_root]]
path = "src/maths"
owner_projects = ["Maths.LinAlg", "Maths.Rng", "Maths.Geometry", "Maths.Optimization"]
status = "owned-shared"
role = "Math utilities umbrella: linear algebra, RNG, geometry abstractions, and optimization."
notes = [
  "src/maths/linalg/ is owned by Maths.LinAlg: Cholesky, Eigen, ICA, Norms, PCA, and OnlineMahalanobis (WelfordMahal).",
  "src/maths/rng/ is owned by Maths.Rng: Xoshiro256++.",
  "src/maths/geometry/ is owned by Maths.Geometry: IRiemannianManifold, product manifolds, EuclideanVectorManifold, and LocalTangent.",
  "src/maths/optimization/ is owned by Maths.Optimization: IRLS, robust losses (folded from src/losses)."
]

[[source_root]]
path = "src/graphs/distance"
owner_projects = ["Graphs.Distance"]
status = "owned"
role = "Distance and similarity metrics organized by geometry."
notes = [
  "euclidean/: Euclidean, Manhattan, Minkowski, Hamming — flat R^d metrics.",
  "geodesic/: Cosine, Poincare, FisherRaoHalfPlane, FisherRaoSimplex, Wasserstein1 — curved/information-geometric metrics.",
  "probability/: JensenShannon, Mahalanobis — distributional and covariance-weighted.",
  "sets/: Jaccard — set overlap metrics.",
  "other/: Canberra, NCD — normalized and compression-based."
]

[[source_root]]
path = "src/graphs"
owner_projects = ["Graphs.Proximity", "Graphs.Coupling", "Graphs.Primitives", "Graphs.Distance"]
status = "owned-shared"
role = "Graph construction, primitives, proximity selectors, and coupling kernels."
notes = [
  "src/graphs/primitives is owned by Graphs.Primitives (CsrGraph, BfsShells, UnionFind).",
  "src/graphs/coupling is owned by Graphs.Coupling.",
  "src/graphs/*.cs and src/graphs/proximity/ are owned by Graphs.Proximity."
]

[[source_root]]
path = "src/estimators"
owner_projects = ["Estimators"]
status = "owned"
role = "Estimator primitives: Karcher mean/median, Weiszfeld scatter, Welford, manifold-aware accumulators."
notes = ["Depends on Maths.Geometry (IRiemannianManifold) and Maths.Optimization via ProjectReference."]

